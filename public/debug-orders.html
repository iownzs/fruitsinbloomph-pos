<!doctype html>
<html>
<head>
  <title>Debug Orders</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./js/firebase-config.js"></script>
  <script src="./js/firebase-service.js"></script>
</head>
<body style="font-family:Arial;padding:24px;background:#0f172a;color:white">
  <h1>Debug Orders</h1>
  <button onclick="loadOrders()">Load Orders</button>
  <pre id="log" style="white-space:pre-wrap;font-size:13px"></pre>

  <script>
    function waitForFirebase(){
      return new Promise((resolve, reject) => {
        let tries = 0;
        const timer = setInterval(() => {
          tries++;
          if(window.db){
            clearInterval(timer);
            resolve();
          }
          if(tries > 50){
            clearInterval(timer);
            reject(new Error(window.FIB_FIREBASE_ERROR || "Firebase not ready."));
          }
        }, 100);
      });
    }

    async function loadOrders(){
      const log = document.getElementById("log");

      try{
        log.textContent = "Loading...";
        await waitForFirebase();

        const snap = await window.db.collection("orders").orderBy("createdAt", "desc").get();

        const rows = snap.docs.map(doc => {
          const o = doc.data();
          return {
            id: doc.id,
            orderId: o.orderId,
            orderType: o.orderType,
            status: o.status,
            kitchenStatus: o.kitchenStatus,
            deliveryStatus: o.deliveryStatus,
            pickupStatus: o.pickupStatus,
            customer: o.customer?.name || "",
            deliveryDate: o.delivery?.deliveryDate || "",
            pickupDate: o.pickup?.pickupDate || ""
          };
        });

        log.textContent = JSON.stringify(rows, null, 2);
      }catch(error){
        log.textContent = "ERROR:\n" + error.message;
      }
    }
  </script>
</body>
</html>
