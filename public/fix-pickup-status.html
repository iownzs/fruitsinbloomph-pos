<!doctype html>
<html>
<head>
  <title>Fix Pickup Status</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./js/firebase-service.js"></script>
</head>
<body style="font-family:Arial;padding:24px;background:#0f172a;color:white">
  <h1>Fix Pickup Status</h1>
  <button onclick="fixPickup()">Fix Pickup Orders Still In Kitchen</button>
  <pre id="log"></pre>

  <script>
    async function fixPickup(){
      const log = document.getElementById("log");
      log.textContent = "Checking orders...";

      const snap = await window.db.collection("orders").get();
      let count = 0;

      for(const doc of snap.docs){
        const order = doc.data();

        if(
          order.orderType === "Pickup" &&
          order.kitchenStatus !== "sent_to_pickup" &&
          order.pickupStatus === "waiting_pickup"
        ){
          await doc.ref.set({
            pickupStatus: "not_started",
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge:true });

          count++;
        }
      }

      log.textContent = `Fixed ${count} pickup orders.`;
    }
  </script>
</body>
</html>
