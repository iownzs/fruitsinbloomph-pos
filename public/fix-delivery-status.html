<!doctype html>
<html>
<head>
  <title>Fix Delivery Status</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./js/firebase-config.js"></script>
  <script src="./js/firebase-service.js"></script>
</head>
<body style="font-family:Arial;padding:24px;background:#0f172a;color:white">
  <h1>Fix Delivery Status</h1>
  <button onclick="fixDelivery()">Fix Sent Delivery Orders</button>
  <pre id="log" style="white-space:pre-wrap"></pre>

  <script>
    function waitForFirebase(){
      return new Promise((resolve, reject) => {
        let tries = 0;

        const timer = setInterval(() => {
          tries++;

          if(window.db){
            clearInterval(timer);
            resolve();
          }

          if(tries > 50){
            clearInterval(timer);
            reject(new Error(window.FIB_FIREBASE_ERROR || "Firebase not ready after waiting."));
          }
        }, 100);
      });
    }

    async function fixDelivery(){
      const log = document.getElementById("log");

      try{
        log.textContent = "Waiting for Firebase...";
        await waitForFirebase();

        log.textContent = "Checking orders...";

        const snap = await window.db.collection("orders").get();
        let count = 0;
        let checked = 0;

        for(const doc of snap.docs){
          checked++;

          const order = doc.data();
          const orderType = String(order.orderType || "").toLowerCase();
          const kitchenStatus = String(order.kitchenStatus || "");
          const deliveryStatus = String(order.deliveryStatus || "");
          const status = String(order.status || "");

          if(
            orderType === "delivery" &&
            (
              kitchenStatus === "sent_to_delivery" ||
              status === "Waiting for Rider"
            ) &&
            deliveryStatus !== "waiting_rider"
          ){
            await doc.ref.set({
              orderType: "Delivery",
              status: "Waiting for Rider",
              kitchenStatus: "sent_to_delivery",
              deliveryStatus: "waiting_rider",
              pickupStatus: "",
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge:true });

            count++;
          }
        }

        log.textContent = `Checked ${checked} orders.\nFixed ${count} delivery orders.`;
      }catch(error){
        log.textContent = "ERROR:\n" + error.message;
        console.error(error);
      }
    }
  </script>
</body>
</html>
